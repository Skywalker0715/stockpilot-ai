<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">StockPilot AI application and technology overview</title>
  <desc id="desc">An illustration of the StockPilot workspace and its React, TypeScript, Vite, FastAPI, SQLite, and optional Cohere architecture.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f7fc"/><stop offset="1" stop-color="#e9effa"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#244eb0"/><stop offset="1" stop-color="#5181e6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1b2a45" flood-opacity=".10"/></filter>
    <style>
      text{font-family:Inter,'Segoe UI',Arial,sans-serif;fill:#1c2533}.muted{fill:#718096}.tiny{font-size:11px}.small{font-size:13px}.label{font-size:12px;font-weight:700;letter-spacing:1.2px}.title{font-size:30px;font-weight:750;letter-spacing:-.5px}.cardtitle{font-size:15px;font-weight:700}
    </style>
  </defs>
  <rect width="1200" height="690" rx="26" fill="url(#bg)"/>
  <circle cx="1110" cy="80" r="100" fill="#dce7fb" opacity=".55"/>
  <circle cx="70" cy="635" r="130" fill="#dce7fb" opacity=".4"/>
  <text x="58" y="57" class="label" fill="#2e5fd0">STOCKPILOT AI · LOCAL-FIRST WORKSPACE</text>
  <text x="58" y="99" class="title">From image library to creator workflow</text>
  <text x="58" y="126" class="small muted">Organize assets, review metadata, and keep analysis connected to your own records.</text>

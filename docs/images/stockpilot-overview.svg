    <rect x="350" y="238" width="120" height="97" rx="11" fill="#f7f9fc" stroke="#e4e8ef"/>
    <rect x="480" y="238" width="130" height="97" rx="11" fill="#f7f9fc" stroke="#e4e8ef"/>

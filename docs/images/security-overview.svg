<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc">
  <title id="title">StockPilot AI security controls and current boundaries</title>
  <desc id="desc">Four implemented security controls: explicit consent before AI processing, image upload validation, server-side secrets, and local SQLite and upload storage. The application must stay on localhost because authentication, app-level AI rate limiting, and encryption at rest are not implemented.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f8fc"/><stop offset="1" stop-color="#edf2f9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#27364d" flood-opacity=".09"/></filter>
    <style>
      text{font-family:Inter,'Segoe UI',Arial,sans-serif;fill:#1c2533}.muted{fill:#667488}.small{font-size:13px}.tiny{font-size:11px}.heading{font-size:27px;font-weight:750;letter-spacing:-.4px}.cardtitle{font-size:16px;font-weight:700}.eyebrow{font-size:11px;font-weight:750;letter-spacing:1.3px}
    </style>
  </defs>
  <rect width="1120" height="570" rx="24" fill="url(#bg)"/>
  <text x="44" y="48" class="eyebrow" fill="#2e5fd0">STOCKPILOT AI · SECURITY OVERVIEW</text>
  <text x="44" y="84" class="heading">Implemented controls, clearly bounded</text>
  <text x="44" y="108" class="small muted">Controls describe the current local MVP; they do not make it suitable for network exposure.</text>

  <!-- Explicit consent -->
  <g filter="url(#shadow)"><rect x="44" y="136" width="500" height="132" rx="16" fill="#fff" stroke="#dce7fb"/>
    <rect x="64" y="158" width="52" height="52" rx="14" fill="#eaf0fc"/>
    <path d="M90 168 103 173v11c0 9-6 15-13 18-7-3-13-9-13-18v-11z" fill="none" stroke="#2e5fd0" stroke-width="2.3" stroke-linejoin="round"/><path d="m84 184 4 4 8-9" fill="none" stroke="#2e5fd0" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="132" y="170" class="eyebrow" fill="#2e5fd0">AI CONSENT</text><text x="132" y="195" class="cardtitle">User approval gates provider calls</text><text x="132" y="220" class="small muted">Both AI flows require explicit consent; the API enforces it.</text><text x="132" y="243" class="tiny" fill="#1c7c4d">Implemented · consent resets for a new image</text>
  </g>
  <!-- Upload validation -->
  <g filter="url(#shadow)"><rect x="576" y="136" width="500" height="132" rx="16" fill="#fff" stroke="#d5ecdf"/>
    <rect x="596" y="158" width="52" height="52" rx="14" fill="#e7f4ec"/>
    <path d="M610 184h24m-12-12v24m-9-18h18v18h-18z" fill="none" stroke="#1c7c4d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="m613 186 6 6 11-12" fill="none" stroke="#1c7c4d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="664" y="170" class="eyebrow" fill="#1c7c4d">FILE SAFETY</text><text x="664" y="195" class="cardtitle">Images are checked before storage</text><text x="664" y="220" class="small muted">Allow-listed formats, decoded content, 10 MiB limit, safe paths.</text><text x="664" y="243" class="tiny" fill="#1c7c4d">Managed uploads use server-generated filenames</text>
  </g>
  <!-- Server-side secrets -->
  <g filter="url(#shadow)"><rect x="44" y="286" width="500" height="132" rx="16" fill="#fff" stroke="#f2e6c6"/>
    <rect x="64" y="308" width="52" height="52" rx="14" fill="#fff5dc"/>
    <rect x="77" y="331" width="26" height="19" rx="4" fill="none" stroke="#96650a" stroke-width="2"/><path d="M82 331v-6a8 8 0 0 1 16 0v6m-8 7v5" fill="none" stroke="#96650a" stroke-width="2" stroke-linecap="round"/>
    <text x="132" y="320" class="eyebrow" fill="#96650a">SECRET HANDLING</text><text x="132" y="345" class="cardtitle">Provider key stays on the backend</text><text x="132" y="370" class="small muted">COHERE_API_KEY is read from server environment configuration.</text><text x="132" y="393" class="tiny" fill="#1c7c4d">Status endpoint reveals presence only, never the key</text>
  </g>
  <!-- Local data -->
  <g filter="url(#shadow)"><rect x="576" y="286" width="500" height="132" rx="16" fill="#fff" stroke="#dce3ee"/>
    <rect x="596" y="308" width="52" height="52" rx="14" fill="#edf1f7"/>
    <ellipse cx="622" cy="322" rx="12" ry="5" fill="#fff" stroke="#53657f" stroke-width="2"/><path d="M610 322v20c0 3 5 6 12 6s12-3 12-6v-20m-24 9c0 3 5 6 12 6s12-3 12-6" fill="none" stroke="#53657f" stroke-width="2"/>
    <text x="664" y="320" class="eyebrow" fill="#53657f">LOCAL STORAGE</text><text x="664" y="345" class="cardtitle">Local records; AI image sharing needs consent</text><text x="664" y="370" class="small muted">SQLite database and managed uploads; back up both together.</text><text x="664" y="393" class="tiny" fill="#96650a">Stored locally in plaintext; no encryption at rest</text>
  </g>

  <rect x="44" y="438" width="1032" height="92" rx="15" fill="#fff0ef" stroke="#f1d2cd"/>
  <circle cx="76" cy="470" r="15" fill="#bc352b"/><path d="M76 461v11m0 6v.5" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="105" y="465" class="eyebrow" fill="#a72e26">DEPLOYMENT BOUNDARY · KEEP IT ON LOCALHOST</text>
  <text x="105" y="490" class="small" font-weight="700">No authentication · no app-level AI rate limit · no encryption at rest</text>
  <text x="105" y="512" class="tiny muted">Do not expose the API to a network or use this MVP for multiple users.</text>
  <text x="1076" y="553" text-anchor="end" class="tiny muted">See the detailed controls and known gaps below.</text>
</svg>
